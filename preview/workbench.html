<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>烘焙门店 · 本地演示工作台</title>
  <style>
    :root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#382c26;background:#f7f4ed;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:#fffaf1;border-bottom:1px solid #e6dfd0;padding:24px max(24px,calc((100vw - 1140px)/2))}h1{font-size:25px;margin:0 0 8px}h2{font-size:21px;margin:0 0 18px}h3{font-size:17px;margin:0 0 10px}p{line-height:1.7}.subtitle{color:#806f61;margin:0}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.badge{border-radius:20px;padding:8px 15px;background:#ede2c9;color:#695335;font-size:13px}.layout{max-width:1190px;margin:26px auto;padding:0 24px;display:grid;grid-template-columns:170px 1fr;gap:26px}nav{display:flex;flex-direction:column;gap:7px}nav button{text-align:left;background:transparent;color:#756353;border-color:transparent}nav button.active{background:#eaddc4;color:#42301e;font-weight:bold}button{font:inherit;cursor:pointer;border:1px solid #dcd3c5;border-radius:9px;padding:9px 14px;background:#fff;color:#4b392b}button:hover{border-color:#ad8654}button:disabled{opacity:.5;cursor:wait}.primary{background:#775530;color:white;border-color:#775530}.danger{color:#a13f35}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px}.card{background:#fff;border:1px solid #e8e1d5;border-radius:14px;padding:21px;margin-bottom:15px}.muted{color:#8a7b6e;font-size:13px}.price{font-size:23px;color:#a36d26;margin:13px 0}.pill{display:inline-block;font-size:12px;border-radius:20px;background:#f1ebdf;color:#7c654b;padding:4px 9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:flex;flex-direction:column;gap:7px;color:#705e4c;font-size:13px}input,select,textarea{font:inherit;border:1px solid #dbd3c4;border-radius:7px;padding:10px;background:#fff;min-width:0;color:#382c26}input[type=checkbox]{width:18px;height:18px}textarea{min-height:70px;resize:vertical}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:18px}.empty{padding:35px;text-align:center;color:#897967}.line{border-top:1px solid #eee6d9;margin-top:15px;padding-top:15px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.metric strong{display:block;font-size:28px;margin-top:10px}#message{max-width:1142px;margin:18px auto 0;padding:12px 18px;border-radius:9px;display:none;background:#e5eedf;color:#395e29}#message.error{background:#f5e1db;color:#923b2e}dialog{border:0;border-radius:14px;padding:25px;max-width:620px;width:90vw;box-shadow:0 20px 80px #0003}dialog::backdrop{background:#34271566}dialog ol{padding-left:22px;line-height:2}footer{max-width:1140px;margin:30px auto;color:#94826f;font-size:12px;padding:0 24px}.stack{display:flex;flex-direction:column;gap:12px}.wide{grid-column:1/-1}
    @media(max-width:760px){.layout{grid-template-columns:1fr;margin-top:15px}nav{flex-direction:row;overflow-x:auto;white-space:nowrap;padding-bottom:5px}.top{align-items:flex-start;flex-direction:column}.grid,.metrics{grid-template-columns:1fr}.badge{font-size:12px}header{padding:20px 24px}}
  </style>
  <script src="/client.js" defer></script><script src="/app.js" defer></script>
</head>
<body>
  <header><div class="top"><div><h1>烘焙门店 · 本地工作台</h1><p class="subtitle">商品预订 / 履约 / 售后 / 经营对账</p></div><span class="badge">虚构数据 · 模拟支付 · 关闭后清空</span></div></header>
  <div id="message" role="status"></div>
  <div class="layout"><aside><label>演示身份<select id="identity"><option value="buyer">顾客</option><option value="staff">店员</option><option value="owner">店主</option></select></label><p class="muted">切换角色体验协作流程，页面使用同一套业务接口。</p><nav id="navigation"></nav></aside><main id="content"><p>正在加载本地数据…</p></main></div>
  <dialog id="details"><div id="detail-content"></div><p><button id="close-details">关闭</button></p></dialog>
  <footer>仅供本地开发预览。此工作台不代表微信页面已经接入，也不代表云环境权限、真实事务或性能已验收。</footer>
</body></html>
